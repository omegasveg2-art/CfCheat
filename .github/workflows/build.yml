name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - aosp: 12
            lin: lineage-19.1
          - aosp: 13
            lin: lineage-20.0
          - aosp: 14
            lin: lineage-21.0
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q cf_esp.zip
      - name: AOSP headers
        working-directory: cf_esp
        run: |
          mkdir -p third_party/aosp && cd third_party/aosp
          git clone -q --depth 1 -b ${{ matrix.lin }} https://github.com/LineageOS/android_frameworks_native.git frameworks_native
          git clone -q --depth 1 -b android${{ matrix.aosp }}-release https://github.com/aosp-mirror/platform_system_core.git system_core
          git clone -q --depth 1 -b android${{ matrix.aosp }}-release https://github.com/aosp-mirror/platform_hardware_libhardware.git hardware_libhardware
      - name: Build
        working-directory: cf_esp
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          CXX=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang++
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang
          mkdir stubs && echo "" > stubs/e.c
          for l in gui ui binder utils cutils; do $CC -shared -o stubs/lib$l.so stubs/e.c -Wl,-soname,lib$l.so; done
          H=third_party/aosp; FN=$H/frameworks_native; SC=$H/system_core
          INC="-I$FN/libs/gui/include -I$FN/libs/ui/include -I$FN/libs/binder/include -I$FN/libs/nativewindow/include -I$FN/libs/arect/include -I$FN/libs/math/include -I$FN/libs/nativebase/include -I$FN/libs/ftl/include -I$FN/libs/renderengine/include -I$FN/libs/graphicsenv/include -I$FN/include -I$SC/libutils/include -I$SC/libcutils/include -I$SC/liblog/include -I$SC/libsystem/include -I$SC/libprocessgroup/include -I$H/hardware_libhardware/include -Ithird_party/imgui -Ithird_party"
          $CXX -std=c++20 -O2 -fno-exceptions -fPIE -pie -DAOSP_VER=${{ matrix.aosp }} -DIMGUI_IMPL_OPENGL_ES3 $INC src/main.cpp src/mem.cpp src/il2cpp.cpp src/game.cpp src/esp.cpp src/overlay_sf.cpp third_party/imgui/imgui*.cpp -o cf_esp -Lstubs -lgui -lui -lbinder -lutils -lcutils -llog -lEGL -lGLESv3 -landroid -static-libstdc++ -Wl,--unresolved-symbols=ignore-all -Wl,--allow-shlib-undefined
          sh pack.sh cf_esp cf_esp_a${{ matrix.aosp }}.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cf_esp_a${{ matrix.aosp }}
          path: cf_esp/cf_esp_a${{ matrix.aosp }}.sh
